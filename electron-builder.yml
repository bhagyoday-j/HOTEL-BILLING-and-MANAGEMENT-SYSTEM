appId: com.hotelbilling.app
productName: Hotel Billing
copyright: Copyright © 2026 Hotel Billing Systems

directories:
  output: release
  buildResources: build

# In-app update feed. electron-builder writes this into resources/app-update.yml,
# which electron-updater reads at runtime. Releases are public, so the app only
# needs anonymous read access: never put a token in the packaged application.
# Releases are created only by .github/workflows/release.yml, never by a local build.
publish:
  provider: github
  owner: bhagyoday-j
  repo: HOTEL-BILLING-and-MANAGEMENT-SYSTEM
  # Keep a new release as a draft until it has been smoke-tested and published
  # on GitHub; electron-updater only sees published releases.
  releaseType: draft

files:
  - apps/desktop/electron/dist/**/*
  - apps/desktop/renderer/dist/**/*
  - apps/server/dist/**/*
  - packages/shared/dist/**/*
  - prisma/**/*
  # Never ship a developer database (it contains local test data).
  - '!prisma/**/*.db'
  - '!prisma/**/*.db-*'
  - node_modules/**/*
  - package.json
  # npm workspaces symlink local packages into node_modules, and the packager skips
  # symlinked packages — so `require('@hotel-billing/shared')` failed in the installed
  # app. Copy the built shared package to its resolvable node_modules path.
  - from: packages/shared
    to: node_modules/@hotel-billing/shared
    filter:
      - dist/**/*
      - package.json
  # `prisma generate` writes the client into node_modules/.prisma, which the
  # `node_modules/**/*` glob does not match because the directory name starts with a
  # dot. Without it the packaged server died on startup with
  # "Cannot find module '.prisma/client/default'".
  - from: node_modules/.prisma
    to: node_modules/.prisma
    filter:
      - '**/*'
      - '!**/*.tmp*'

# Native binaries cannot be loaded from inside an asar archive: Prisma's query engine
# and argon2's prebuilt addon must exist as real files on disk.
asarUnpack:
  - node_modules/.prisma/**
  - node_modules/argon2/**

extraResources:
  # Migrations let the packaged server create or upgrade the AppData database on first
  # run. Only the migrations and schema are shipped — not any local dev database.
  - from: prisma
    to: prisma
    filter:
      - migrations/**/*
      - schema.prisma

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: HotelBillingSetup.${ext}
  # No code-signing certificate is configured. Disabling executable signing/editing
  # lets electron-builder build without extracting its winCodeSign bundle, which
  # needs symlink privileges (Windows Developer Mode or admin) that may be absent.
  # Re-enable (or set to true) once a signing certificate is available.
  signAndEditExecutable: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  shortcutName: Hotel Billing
